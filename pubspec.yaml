name: flutter_application_base
description: "Flutter base project."

# Evita que el paquete se publique accidentalmente en pub.dev
publish_to: 'none' 

version: 0.1.0

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0+1
  http: ^1.2.1
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.2  
  go_router: ^14.7.2 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/.env
    - assets/loading.gif
    - assets/images/
    - assets/avatars/
    - assets/images/populares/

